<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeekMusic</title>
<meta name="description" content="PeekMusic: a YouTube Music client for Android with lyrics right in the player.">
<style>
  :root { --bg:#f6f6f8; --fg:#18181c; --muted:#5e5e6a; --accent:#3b3a8f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --fg:#ececf1; --muted:#a0a0ad; --accent:#a9a7ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; padding: 40px 20px; }
  h1 { font-size: 2.4rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 24px; }
  nav { display:flex; gap: 20px; flex-wrap: wrap; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>PeekMusic</h1>
  <p>A YouTube Music client for Android with the current lyric line right in the player, translations, and listening together with friends.</p>
  <nav>
    <a href="https://github.com/PeekMusic/PeekMusic/releases">Download</a>
    <a href="https://github.com/PeekMusic/PeekMusic">GitHub</a>
    <a href="/privacy/">Privacy / Datenschutz</a>
  </nav>
</main>
</body>
</html>
