name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        # PeekMusic: Debug links in minutes on GitHub's runners and is enough for test installs.
        description: Framework configuration for the IPA
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  # Dispatched IPA builds get their own group so pushes to main cannot cancel them.
  group: ios-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS App & Framework
    uses: ./.github/workflows/reusable-ios-build.yml
    permissions:
      contents: read
    with:
      upload-artifact: ${{ github.event_name == 'workflow_dispatch' }}
      cache-read-only: ${{ github.event_name == 'pull_request' }}
      ipa-configuration: ${{ inputs.configuration || 'Release' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
      LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
