# PeekMusic on Crowdin: only PeekMusic's own strings (peek_strings.xml).
# Upstream Metrolist strings (strings.xml) are translated on Metrolist's Weblate and arrive with upstream merges.
# Never add them here, or Crowdin and Weblate overwrite each other.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /shared/src/commonMain/composeResources/values/peek_strings.xml
    translation: /shared/src/commonMain/composeResources/values-%android_code%/peek_strings.xml
    type: android
    # Untranslated keys fall back to English at runtime; never copy English into a locale file.
    skip_untranslated_strings: true
    # Crowdin language ID -> the composeResources folder upstream already uses.
    languages_mapping:
      android_code:
        ar: ar
        be: be
        bg: bg
        bn: bn
        bn-IN: bn-rIN
        bs: bs
        ca: ca
        cs: cs
        da: da
        de: de
        el: el
        en-CA: en-rCA
        es-ES: es
        es-US: es-rUS
        et: et
        fa: fa
        fi: fi
        fil: fil
        fr: fr
        he: iw
        hi: hi
        hr: hr
        hu: hu
        id: in
        it: it
        ja: ja
        ko: ko
        lt: lt
        lv: lv
        ml-IN: ml
        ms: ms
        nb: nb-rNO
        ne-NP: ne
        nl: nl
        nn-NO: nn
        pa-IN: pa
        pl: pl
        pt-BR: pt-rBR
        pt-PT: pt
        ro: ro
        ru: ru
        si-LK: si
        sk: sk
        sl: sl
        sr-CS: sr
        sv-SE: sv
